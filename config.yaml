# Central configuration. Every tunable constant used by the code lives here.
# All values describe an INVENTED toy process; none come from any real process.
seed: 42

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s: %(message)s"

paths:
  data: data/synthetic_trials.csv
  example_lab_data: data/example_lab_trials.csv
  model: models/best_model.joblib
  metrics: reports/metrics.json
  cv_results: reports/cv_results.csv
  learning_curve: reports/learning_curve.csv
  lab_score_json: reports/lab_score.json
  lab_score_rows: reports/lab_score_rows.csv
  figures_dir: reports/figures
  trial_report: reports/trial_efficiency.md
  trial_runs: reports/trial_efficiency_runs.csv

features:
  categorical: [feed_type]
  feed_numeric: [feed_metal_grade_pct, particle_size_um]
  recipe_numeric:
    [reagent_molarity, oxidant_molarity, solid_liquid_ratio, pH, ORP_mV, temperature_C, time_min, agitation_rpm]
  group: batch_id
  target: recovery_fraction

# Validation limits for ANY incoming data (deliberately wider than the design space;
# values inside these limits but outside the training range are flagged as OOD, not rejected).
schema:
  categories:
    feed_type: [A, B, C]
  ranges:
    feed_metal_grade_pct: [0.0, 100.0]
    particle_size_um: [1.0, 5000.0]
    reagent_molarity: [0.0, 10.0]
    oxidant_molarity: [0.0, 5.0]
    solid_liquid_ratio: [0.001, 1.0]
    pH: [-1.0, 14.0]
    ORP_mV: [-500.0, 1500.0]
    temperature_C: [0.0, 100.0]
    time_min: [0.0, 10000.0]
    agitation_rpm: [0.0, 3000.0]
    recovery_fraction: [0.0, 1.0]
  max_errors_reported: 20

simulation:
  n_trials: 150
  n_batches: 12
  batch_prefix: B
  round_decimals: 4
  feed_type_probs: { A: 0.40, B: 0.35, C: 0.25 }
  feed_ranges: # batch-level feed properties
    feed_metal_grade_pct: [0.5, 6.0]
    particle_size_um: [40.0, 250.0]
  recipe_bounds: # design space sampled uniformly (a crude DOE)
    reagent_molarity: [0.2, 2.0]
    oxidant_molarity: [0.0, 0.6]
    solid_liquid_ratio: [0.05, 0.40]
    pH: [0.5, 3.0]
    ORP_mV: [350.0, 750.0]
    temperature_C: [25.0, 90.0]
    time_min: [30.0, 480.0]
    agitation_rpm: [100.0, 600.0]
  batch_effect_sd: 0.05 # log-scale multiplicative random effect on R_max
  noise_sd_base: 0.01 # heteroscedastic noise: sd = base + peak * 4R(1-R)
  noise_sd_peak: 0.03
  kinetics:
    r_max: { A: 0.97, B: 0.88, C: 0.78 }
    ph_opt: { A: 1.2, B: 1.8, C: 2.3 }
    ph_width: 1.5
    reagent_half_sat: 0.15
    sl_threshold: 0.20
    sl_penalty: 1.2
    grade_effect: 0.01
    grade_ref: 3.0
    k_ref_per_min: 0.006
    temp_ref_C: 50.0
    activation_K: 4000.0
    oxidant_gain: 4.0
    oxidant_decomp_C: 70.0
    oxidant_decomp_scale_C: 10.0
    orp_mid_mV: 500.0
    orp_scale_mV: 40.0
    orp_passivation_mV: 650.0
    orp_passivation_per_mV: 0.004
    particle_ref_um: 100.0
    particle_exponent: 0.8
    agitation_sat_rpm: 300.0
    agitation_floor: 0.5

model:
  test_batch_fraction: 0.25 # fraction of BATCHES held out as the final test set
  outer_folds: 5
  inner_folds: 3
  selection_metric: rmse
  scoring: neg_root_mean_squared_error
  candidates:
    mean:
      estimator: dummy
      params: { strategy: mean }
    ridge:
      estimator: ridge
      grid: { alpha: [0.01, 0.1, 1.0, 10.0, 100.0] }
    elasticnet:
      estimator: elasticnet
      params: { max_iter: 50000 }
      grid: { alpha: [0.0005, 0.005, 0.05], l1_ratio: [0.2, 0.5, 0.8] }
    random_forest:
      estimator: random_forest
      params: { n_estimators: 300, n_jobs: -1 }
      grid: { max_depth: [null, 6], min_samples_leaf: [1, 3], max_features: [0.5, 1.0] }
    gradient_boosting:
      estimator: gradient_boosting
      params: { subsample: 0.8 }
      grid: { n_estimators: [150, 400], max_depth: [2, 3], learning_rate: [0.03, 0.1] }
    gradient_boosting_fe: # same model with engineered features + logit target (isolates their effect)
      estimator: gradient_boosting
      engineered_features: true
      target_transform: logit
      params: { subsample: 0.8 }
      grid: { n_estimators: [150, 400], max_depth: [2, 3], learning_rate: [0.03, 0.1] }
    gaussian_process: # hyperparameters fitted by marginal likelihood, so no grid
      estimator: gaussian_process
      engineered_features: true
      target_transform: logit
      gp: { kernel: ard, nu: 2.5, noise_init: 0.1, n_restarts: 2 }
    gp_ensemble: # average of a per-input-scale GP and a single-scale GP (steadier with few trials)
      estimator: voting
      members:
        ard:
          estimator: gaussian_process
          engineered_features: true
          target_transform: logit
          gp: { kernel: ard, nu: 2.5, noise_init: 0.1, n_restarts: 2 }
        isotropic:
          estimator: gaussian_process
          engineered_features: true
          target_transform: logit
          gp: { kernel: isotropic, nu: 2.5, noise_init: 0.1, n_restarts: 2 }
  logit_eps: 0.001 # clip recovery to [eps, 1-eps] before the logit transform
  learning_curve:
    sizes: [30, 60, 90, 120, 150]
    repeats: 10
    models: [best, gradient_boosting, ridge, mean] # "best" = the selected model
    eval_n_batches: 20 # fresh, never-seen batches simulated only for evaluation
    eval_n_trials: 400
    eval_seed_offset: 1000
    eval_batch_prefix: LC

# Generic engineered features (used by candidates with engineered_features: true)
feature_engineering:
  log: [time_min, particle_size_um, reagent_molarity] # log1p
  inverse_kelvin: [temperature_C] # 1 / (T + 273.15), Arrhenius-style
  square: [pH] # lets linear-in-features models express an optimum
  interact_with_category: { feed_type: [pH] } # optimum may differ by feed type

uncertainty:
  alpha: 0.10 # 90% nominal intervals
  n_bootstrap: 30
  conformal_folds: 5

ood:
  range_tolerance: 0.05 # fraction of the training range allowed beyond min/max
  mahalanobis_quantile: 0.99 # chi-square quantile for the feed-composition distance

recommend:
  top_k: 3
  max_top_k: 20
  cost_weight: 0.10 # recovery-fraction units per unit of normalised recipe cost
  cost_coefficients: # relative cost of pushing each variable from its lower to upper bound
    reagent_molarity: 1.0
    oxidant_molarity: 1.5
    temperature_C: 0.5
    time_min: 0.5
    agitation_rpm: 0.2
  diversity_min_distance: 0.15 # normalised euclidean distance between returned recipes
  bound_tolerance: 0.01 # fraction of range treated as "at the bound"
  de:
    maxiter: 60
    popsize: 15
    tol: 1.0e-6
    mutation: [0.5, 1.0]
    recombination: 0.7

trial_study:
  n_runs: 100
  budget: 15
  targets: [0.70, 0.80, 0.90]
  cost_weight: 0.0
  step_fraction: 0.25
  min_step_fraction: 0.03
  seed: 2024
  batch_prefix: TS
  oracle_de: { maxiter: 100, popsize: 20, tol: 1.0e-8 }

api:
  max_trials_per_request: 1000
