[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leach-recipe-predictor"
version = "0.1.0"
description = "Methodology demo: predict leaching recovery from recipe + feed composition and recommend recipes. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.6",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
app = ["streamlit>=1.35"]

[project.scripts]
leach = "leach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning:sklearn.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]
